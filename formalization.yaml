version: "v0.4"

project:
  name: "Cyclic n × n Latin Squares Representing Solutions of (n, c)-Coins Problems"
  description: >-
    Formalization of incremental n × n Latin squares and cyclic incremental
    n × n Latin squares representing n + 1 solutions of (n, c)-coins problems
    simultaneously for all 0 ≤ c ≤ n. We prove that (1) for every n ≥ 4, any
    incremental n × n Latin square represents valid (n, c)-coins solutions for
    all 0 ≤ c ≤ n simultaneously via value thresholding, and (2) for every
    n ≥ 4 with n ∉ {4, 6}, there exists a column permutation p such that the
    cyclic Latin square L(i, j) = (i + p(j)) mod n is incremental, using an
    injective-majorization principle across four infinite modular families
    modulo 6 and the four exceptional dimensions n ∈ {8, 9, 15, 21}, together
    with explicit non-cyclic incremental Latin squares for n = 4 and n = 6.
  authors:
    - "Marc Duponcheel"
    - "Luc Duponcheel"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Luc Duponcheel"

